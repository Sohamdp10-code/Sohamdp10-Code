name: Update contribution graph

on:
  push:
    paths:
      - ".github/workflows/update-activity-graph.yml"
      - "scripts/generate_activity_graph.py"
  schedule:
    # Runs daily at 00:00 India Standard Time (18:30 UTC).
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate contribution SVG
        env:
          GITHUB_USERNAME: Sohamdp10-code
        run: python scripts/generate_activity_graph.py

      - name: Commit updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity-graph.svg
          if git diff --cached --quiet; then
            echo "Contribution graph is already up to date."
            exit 0
          fi
          git commit -m "chore: refresh contribution graph"
          git push
