<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
  <title id="title">SOHAM terminal wordmark</title>
  <desc id="desc">An original terminal panel with a SOHAM ASCII wordmark.</desc>
  <rect width="1000" height="440" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect width="1000" height="48" rx="16" fill="#161b22"/>
  <circle cx="30" cy="24" r="7" fill="#ff5f56"/><circle cx="54" cy="24" r="7" fill="#ffbd2e"/><circle cx="78" cy="24" r="7" fill="#27c93f"/>
  <text x="500" y="30" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="15" fill="#8b949e">sohamdp10-code@github: ~ $ ./identity.sh</text>
